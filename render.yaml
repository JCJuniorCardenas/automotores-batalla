# Blueprint de Render para la DEMO (plan gratis): un solo servicio (web + API) y una base Postgres.
# Guía: docs/DEPLOY-RENDER.md. Producción real: ver docs/DEPLOY.md (Railway) y no usar el plan gratis.
databases:
  - name: batalla-db
    plan: free
    databaseName: batalla
    user: batalla
    region: virginia

services:
  - type: web
    name: batalla-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: batalla-db
          property: connectionString
      # Secretos de sesión: los genera Render.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Los pide Render al crear el Blueprint (los escribe la persona dueña de la cuenta, no se guardan en el repo).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Crea el admin y los autos de ejemplo al arrancar (idempotente).
      - key: RUN_SEED
        value: "1"
      # URL pública. Si Render asigna otro nombre (batalla-demo ya tomado), corregirla y redeployar.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://batalla-demo.onrender.com
